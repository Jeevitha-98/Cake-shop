<script>
    document.addEventListener("DOMContentLoaded", function () {
  
  const loginFormEngine = document.getElementById('atelier-login-form');
  const roleInputTracker = document.getElementById('assigned-auth-role');
  const emailInputSelector = document.getElementById('login-email');

  // 1. DYNAMIC PROFILE ACCESS SELECTION SLOT SWAPPER
  window.assignActivePortalRole = function (clickedRolePill) {
    if (!clickedRolePill) return;
    if (clickedRolePill.classList.contains('active-role')) return;

    // Remove active state from the alternative option cell
    document.querySelector('.role-selector-pill.active-role').classList.remove('active-role');
    clickedRolePill.classList.add('active-role');

    // Sync state back to hidden input node for form compilation
    const assignedRoleString = clickedRolePill.getAttribute('data-role');
    roleInputTracker.value = assignedRoleString;
  };

  // 2. CORE LOGIN ACCOUNT FORM ROUTER VALIDATOR
  if (loginFormEngine) {
    loginFormEngine.addEventListener('submit', function (event) {
      event.preventDefault(); // Securely blocks browser page refreshes

      const targetedRole = roleInputTracker.value;
      const emailValue = emailInputSelector.value.trim();

      alert(`Welcome to the Vault!\n\nAuthenticated successfully as: ${targetedRole.toUpperCase()}\nAccount: ${emailValue}`);

      // 3. DYNAMIC ROUTING TO REDIRECT DESTINATION DASHBOARDS BASED ON ACTIVE ROLE
      if (targetedRole === "owner") {
        window.location.href = "partner-dashboard.html"; // Routes to your internal baking matrix master panel
      } else {
