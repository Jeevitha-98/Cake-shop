<script>
    (function() {
  /**
   * Smoothly fades and unloads the modern stone/mocha preloader
   */
  function liftModernPreloader() {
    const preloader = document.getElementById('bakery-preloader-shroud');
    
    if (preloader) {
      // 1. Adds the clear class to trigger the 0.5s CSS opacity fade-out
      preloader.classList.add('shroud-clear');
      
      // 2. Safely removes the element from the page markup after the fade finishes
      setTimeout(function() {
        preloader.remove();
      }, 500); // 500ms perfectly matches your CSS transition timeline
    }
  }

  /**
   * Queues the fade-out to align with the linear loading bar animation
   */
  function queuePreloaderLift() {
    // 1800ms gives your linear-progress-fill-bar time to expand fully across the screen
    setTimeout(liftModernPreloader, 1800);
  }

  // Runs immediately if the page markup is ready, or hooks into the load listener
  if (document.readyState === 'interactive' || document.readyState === 'complete') {
    queuePreloaderLift();
  } else {
    document.addEventListener('DOMContentLoaded', queuePreloaderLift);
  }
})();

</script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
  const menuToggleButton = document.getElementById("menu-toggle-trigger");
  const navigationMenuOverlay = document.getElementById("mobile-nav-overlay");
  const overlayLinksList = document.querySelectorAll(".nav-links a");
  const mainHeaderElement = document.querySelector(".global-header");

  // 1. MOBILE HAMBURGER NAVIGATION SYSTEM
  if (menuToggleButton && navigationMenuOverlay) {
    // Open/Close menu overlay view on click
    menuToggleButton.addEventListener("click", function (event) {
      event.stopPropagation();
      navigationMenuOverlay.classList.toggle("mobile-menu-active");
    });

    // Close panel drawer automatically upon choosing a routing option
    overlayLinksList.forEach(function (link) {
      link.addEventListener("click", function () {
        navigationMenuOverlay.classList.remove("mobile-menu-active");
      });
    });

    // Close panel menu immediately if user clicks background area outside elements
    document.addEventListener("click", function (event) {
      if (!navigationMenuOverlay.contains(event.target) && !menuToggleButton.contains(event.target)) {
        navigationMenuOverlay.classList.remove("mobile-menu-active");
      }
    });
  }

  // 2. DYNAMIC SCROLL CAPSULE CONVERSION CONTROLLER
  if (mainHeaderElement) {
    window.addEventListener("scroll", function () {
      // Flattens out floating capsule design to sticky top bar after 40px scroll depth
      if (window.scrollY > 40) {
        mainHeaderElement.classList.add("scrolled-state");
      } else {
        mainHeaderElement.classList.remove("scrolled-state");
      }
    });
  }
});

</script>
